<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Math Battle Arena - Fungsi Komposisi</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1a0a2e; --bg2:#3d1a5e; --bg3:#6b2d8f;
  --gold:#ffd700; --gold2:#ffaa00; --red:#ff2d55; --red2:#c41e3a;
  --blue:#00d4ff; --green:#00ff88; --purple:#a855f7;
  --cream:#fff8e7; --ink:#1a0a2e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;color:#fff;
  background:radial-gradient(ellipse at top,var(--bg3) 0%,var(--bg2) 40%,var(--bg1) 100%);
  min-height:100vh;overflow-x:hidden;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,215,0,.15) 0%,transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(168,85,247,.2) 0%,transparent 40%),
    radial-gradient(circle at 50% 50%,rgba(0,212,255,.1) 0%,transparent 50%);
  animation:bgPulse 8s ease-in-out infinite;
}
@keyframes bgPulse{50%{opacity:.7}}

/* Lampu sorot */
.spotlight{position:fixed;width:300px;height:300px;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);animation:spotMove 10s ease-in-out infinite}
.spot1{top:-100px;left:-50px;animation-delay:0s}
.spot2{bottom:-100px;right:-50px;animation-delay:-5s}
@keyframes spotMove{0%,100%{transform:translate(0,0)}50%{transform:translate(100px,100px)}}

h1,h2,h3,.display{font-family:'Bebas Neue',sans-serif;letter-spacing:2px}
#app{position:relative;z-index:10;max-width:1400px;margin:0 auto;padding:20px}
.screen{display:none}
.screen.active{display:block;animation:popIn .5s ease}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

/* Judul */
.title{
  font-size:clamp(2.5rem,8vw,5rem);text-align:center;color:#fff;
  text-shadow:0 0 20px var(--gold),0 0 40px var(--gold2),4px 4px 0 var(--red2);
  margin-bottom:10px;line-height:1;
}
.subtitle{text-align:center;font-size:1.2rem;color:var(--gold);font-weight:700;margin-bottom:20px}

/* Panel */
.panel{
  background:linear-gradient(135deg,rgba(61,26,94,.9),rgba(26,10,46,.95));
  border:3px solid var(--gold);border-radius:20px;padding:24px;
  box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
  backdrop-filter:blur(10px);
}

/* Tombol */
.btn{
  font-family:'Poppins';font-weight:800;font-size:1.1rem;color:#fff;border:none;cursor:pointer;
  padding:14px 32px;border-radius:16px;
  background:linear-gradient(135deg,var(--red),var(--red2));
  box-shadow:0 6px 0 #8b0000,0 10px 20px rgba(0,0,0,.4);
  transition:all .15s;display:inline-flex;align-items:center;gap:10px;
  text-transform:uppercase;letter-spacing:1px;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 #8b0000,0 14px 24px rgba(0,0,0,.5)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8b0000}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);box-shadow:0 6px 0 #b8860b,0 10px 20px rgba(0,0,0,.4)}
.btn.gold:active{box-shadow:0 2px 0 #b8860b}
.btn.blue{background:linear-gradient(135deg,var(--blue),#0099cc);box-shadow:0 6px 0 #006688,0 10px 20px rgba(0,0,0,.4)}
.btn.blue:active{box-shadow:0 2px 0 #006688}
.btn.big{font-size:1.4rem;padding:18px 48px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Setup */
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:768px){.setup-grid{grid-template-columns:1fr}}
.setup-card{text-align:center}
.setup-card h3{color:var(--gold);font-size:1.8rem;margin-bottom:12px}
.mode-btn{
  width:100%;padding:20px;margin-bottom:12px;font-size:1.2rem;font-weight:800;
  background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.3);border-radius:16px;
  color:#fff;cursor:pointer;transition:all .2s;
}
.mode-btn:hover{background:rgba(255,215,0,.2);border-color:var(--gold)}
.mode-btn.selected{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);border-color:var(--gold)}
.team-input{
  width:100%;padding:14px;font-size:1.1rem;font-family:'Poppins';font-weight:700;
  background:rgba(255,255,255,.95);border:3px solid var(--gold);border-radius:12px;
  color:var(--ink);margin-bottom:10px;
}
.team-input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 4px rgba(255,45,85,.3)}
.add-team-btn{
  width:100%;padding:12px;background:rgba(0,255,136,.2);border:2px dashed var(--green);
  border-radius:12px;color:var(--green);font-weight:700;cursor:pointer;transition:all .2s;
}
.add-team-btn:hover{background:rgba(0,255,136,.3)}

/* Arena */
.arena-header{
  display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(255,215,0,.15),rgba(255,45,85,.1));
  border:3px solid var(--gold);border-radius:20px;padding:16px 24px;margin-bottom:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}
.round-info{font-size:1.3rem;font-weight:800}
.round-info .round-name{color:var(--gold);font-size:1.6rem;display:block}
.timer-box{
  background:rgba(0,0,0,.5);border:3px solid var(--red);border-radius:16px;padding:12px 20px;
  min-width:180px;text-align:center;
}
.timer-num{font-size:2.5rem;font-weight:900;color:var(--red);font-family:'Bebas Neue'}
.timer-num.warn{color:var(--gold);animation:blink .5s steps(2) infinite}
.timer-num.danger{color:#fff;background:var(--red);border-radius:8px;padding:0 10px}
@keyframes blink{50%{opacity:.5}}

/* Scoreboard */
.scoreboard{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px;
}
.team-card{
  background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.05));
  border:3px solid rgba(255,255,255,.3);border-radius:16px;padding:16px;text-align:center;
  transition:all .3s;position:relative;overflow:hidden;
}
.team-card.active{
  border-color:var(--gold);box-shadow:0 0 30px rgba(255,215,0,.5);
  transform:scale(1.05);
}
.team-card.active::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(45deg,transparent,rgba(255,215,0,.2),transparent);
  animation:shine 2s infinite;
}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.team-name{font-size:1.3rem;font-weight:800;margin-bottom:8px}
.team-score{font-size:2.5rem;font-weight:900;color:var(--gold);font-family:'Bebas Neue'}
.team-card .powerups{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.powerup{
  width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;
  border:2px solid rgba(255,255,255,.4);transition:all .2s;
}
.powerup:hover:not(:disabled){transform:scale(1.15);background:rgba(255,215,0,.3)}
.powerup:disabled{opacity:.3;cursor:not-allowed}

/* Soal */
.question-card{
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,248,231,.95));
  border:4px solid var(--gold);border-radius:24px;padding:30px;margin-bottom:20px;
  box-shadow:0 15px 50px rgba(0,0,0,.5);color:var(--ink);
}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.q-difficulty{
  padding:6px 18px;border-radius:99px;font-weight:800;font-size:.95rem;text-transform:uppercase;
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}
.q-difficulty.easy{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#fff}
.q-difficulty.medium{background:linear-gradient(135deg,#ffaa00,#ff8800);color:#fff}
.q-difficulty.hard{background:linear-gradient(135deg,#ff2d55,#c41e3a);color:#fff}
.q-number{font-size:1.2rem;font-weight:800;color:var(--purple)}
.q-text{
  font-size:clamp(1.2rem,3.5vw,1.6rem);font-weight:700;line-height:1.6;margin-bottom:24px;
  background:rgba(255,215,0,.1);padding:20px;border-radius:16px;border-left:5px solid var(--gold);
}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.choices{grid-template-columns:1fr}}
.choice{
  background:#fff;border:4px solid #ddd;border-radius:16px;padding:18px;font-size:1.15rem;
  font-weight:700;cursor:pointer;transition:all .2s;position:relative;text-align:left;
  font-family:'Poppins';color:var(--ink);
}
.choice:hover:not(:disabled){border-color:var(--blue);transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.choice:disabled{cursor:default}
.choice .key{
  position:absolute;top:-10px;left:-10px;width:32px;height:32px;background:var(--red);color:#fff;
  border-radius:10px;font-size:1rem;display:flex;align-items:center;justify-content:center;
  border:3px solid #fff;font-weight:900;
}
.choice.correct{background:#d4edda;border-color:#28a745;animation:bounceCorrect .5s}
.choice.wrong{background:#f8d7da;border-color:#dc3545;animation:shakeWrong .4s}
.choice.eliminated{opacity:.3;text-decoration:line-through}
@keyframes bounceCorrect{40%{transform:scale(1.08)}}
@keyframes shakeWrong{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}

/* Pembahasan */
.explanation{
  display:none;margin-top:20px;background:linear-gradient(135deg,#fff3cd,#ffe69c);
  border:3px solid var(--gold2);border-radius:16px;padding:20px;color:var(--ink);
}
.explanation.show{display:block;animation:popIn .4s}
.explanation h4{color:var(--red2);font-size:1.3rem;margin-bottom:10px}
.explanation p{font-weight:600;line-height:1.7;font-size:1.05rem}

/* Overlay */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:none;
  align-items:center;justify-content:center;padding:20px;
}
.overlay.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
.overlay-panel{
  background:linear-gradient(135deg,var(--bg3),var(--bg2));
  border:5px solid var(--gold);border-radius:24px;padding:40px;max-width:600px;width:100%;
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:popIn .5s;
}
.overlay-panel h2{font-size:2.5rem;color:var(--gold);margin-bottom:16px;text-shadow:0 0 20px var(--gold)}
.overlay-panel .big-emoji{font-size:5rem;margin:20px 0;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}

/* Rekap */
.recap-table{width:100%;border-collapse:collapse;margin:20px 0}
.recap-table th,.recap-table td{padding:14px;text-align:left;border-bottom:2px solid rgba(255,255,255,.2)}
.recap-table th{background:rgba(255,215,0,.2);color:var(--gold);font-size:1.1rem;font-weight:800}
.recap-table tr:hover{background:rgba(255,255,255,.05)}
.recap-table .rank{font-size:1.5rem;font-weight:900;color:var(--gold)}
.recap-table .winner{background:rgba(255,215,0,.15);border:2px solid var(--gold)}

/* Efek */
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.point-popup{
  position:absolute;font-family:'Bebas Neue';font-size:3rem;color:var(--gold);
  text-shadow:0 0 20px var(--gold),3px 3px 0 var(--red2);animation:pointRise 1.5s ease-out forwards;
}
@keyframes pointRise{to{transform:translateY(-150px) scale(1.5);opacity:0}}
.confetti{
  position:absolute;width:12px;height:18px;border-radius:3px;animation:confettiFall linear forwards;
}
@keyframes confettiFall{to{transform:translate(var(--sw),108vh) rotate(720deg)}}

/* Proyektor mode */
body.projector-mode{font-size:1.3rem}
body.projector-mode .title{font-size:6rem}
body.projector-mode .team-score{font-size:4rem}
body.projector-mode .q-text{font-size:2rem}
body.projector-mode .choice{font-size:1.5rem;padding:24px}

/* Utility */
.text-center{text-align:center}
.mt-20{margin-top:20px}
.mb-20{margin-bottom:20px}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="spotlight spot1"></div>
<div class="spotlight spot2"></div>
<div id="fxLayer"></div>

<main id="app">

  <!-- SETUP -->
  <section id="scr-setup" class="screen active">
    <h1 class="title">🏆 MATH BATTLE ARENA 🏆</h1>
    <p class="subtitle">Fungsi Komposisi • SMK Kelas XI • Jurusan Kuliner</p>
    
    <div class="panel">
      <div class="setup-grid">
        <div class="setup-card">
          <h3>🎮 Pilih Mode</h3>
          <button class="mode-btn selected" onclick="selectMode('individual')">👤 Individu</button>
          <button class="mode-btn" onclick="selectMode('team')">👥 Kelompok</button>
        </div>
        <div class="setup-card">
          <h3>⚙️ Pengaturan</h3>
          <label style="display:block;text-align:left;font-weight:700;margin-bottom:8px">
            <input type="checkbox" id="projMode" style="margin-right:8px"> Mode Proyektor (teks besar)
          </label>
          <label style="display:block;text-align:left;font-weight:700;margin-bottom:8px">
            <input type="checkbox" id="soundOn" checked style="margin-right:8px"> Aktifkan Suara
          </label>
          <p style="font-size:.9rem;opacity:.8">Waktu per soal: 30 detik | Total: 15 soal</p>
        </div>
      </div>
      
      <div id="teamSetup">
        <h3 style="color:var(--gold);font-size:1.8rem;margin:20px 0 12px">👥 Daftar Peserta</h3>
        <div id="teamList"></div>
        <button class="add-team-btn" onclick="addTeam()">+ Tambah Peserta</button>
      </div>
      
      <div class="text-center mt-20">
        <button class="btn gold big" onclick="startGame()">🚀 MULAI PERTANDINGAN!</button>
      </div>
    </div>
  </section>

  <!-- ARENA -->
  <section id="scr-arena" class="screen">
    <div class="arena-header">
      <div class="round-info">
        <span class="round-name" id="roundName">Babak 1: Mudah</span>
        <span id="roundDesc">Soal 1 dari 5</span>
      </div>
      <div class="timer-box">
        <div style="font-size:.9rem;font-weight:700;opacity:.8">WAKTU</div>
        <div class="timer-num" id="timerNum">30</div>
      </div>
    </div>
    
    <div class="scoreboard" id="scoreboard"></div>
    
    <div class="question-card" id="questionCard">
      <div class="q-header">
        <span class="q-difficulty" id="qDifficulty">MUDAH</span>
        <span class="q-number" id="qNumber">Soal 1/15</span>
      </div>
      <div class="q-text" id="qText"></div>
      <div class="choices" id="qChoices"></div>
      <div class="explanation" id="qExplanation">
        <h4>💡 Pembahasan</h4>
        <p id="explanationText"></p>
      </div>
    </div>
    
    <div class="text-center" id="nextBtnWrap">
      <button class="btn blue big hidden" id="nextBtn" onclick="nextQuestion()">Soal Berikutnya ➜</button>
    </div>
  </section>

  <!-- REKAP -->
  <section id="scr-recap" class="screen">
    <h1 class="title">🏆 HASIL AKHIR 🏆</h1>
    <div class="panel">
      <table class="recap-table">
        <thead>
          <tr><th>Peringkat</th><th>Peserta</th><th>Skor</th><th>Benar</th><th>Salah</th></tr>
        </thead>
        <tbody id="recapBody"></tbody>
      </table>
      <div class="text-center mt-20">
        <button class="btn gold big" onclick="window.print()">🖨️ Cetak Rekap</button>
        <button class="btn blue big" onclick="location.reload()">🔄 Main Lagi</button>
      </div>
    </div>
  </section>

</main>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <div class="overlay-panel">
    <div class="big-emoji" id="overlayEmoji">🎉</div>
    <h2 id="overlayTitle">Selamat!</h2>
    <p id="overlayText" style="font-size:1.2rem;font-weight:700;margin:16px 0"></p>
    <button class="btn gold big" id="overlayBtn" onclick="closeOverlay()">Lanjut</button>
  </div>
</div>

<script>
/* ================= DATA SOAL ================= */
const SOAL = [
  // MUDAH (5)
  {diff:'easy',q:'Diketahui f(x) = x + 3 dan g(x) = 2x. Dalam sebuah resep kue, fungsi f mewakili penambahan gula (gram) dan g mewakili penggandaan tepung. Berapakah nilai (f∘g)(4)?',
   choices:['8','11','14','10'],answer:1,
   explain:'(f∘g)(x) = f(g(x)) = f(2x) = 2x + 3. Untuk x = 4: (f∘g)(4) = 2(4) + 3 = 8 + 3 = <b>11</b>.'},
  {diff:'easy',q:'Notasi (f∘g)(x) menyatakan...',
   choices:['f(x) × g(x)','f(g(x))','g(f(x))','f(x) + g(x)'],answer:1,
   explain:'(f∘g)(x) dibaca "f komposisi g" dan didefinisikan sebagai <b>f(g(x))</b>, yaitu fungsi g diterapkan lebih dahulu, kemudian hasilnya dimasukkan ke fungsi f.'},
  {diff:'easy',q:'Diketahui f(x) = 3x − 1 dan g(x) = x². Nilai (f∘g)(2) adalah...',
   choices:['11','12','13','14'],answer:0,
   explain:'(f∘g)(2) = f(g(2)) = f(2²) = f(4) = 3(4) − 1 = 12 − 1 = <b>11</b>.'},
  {diff:'easy',q:'Jika f(x) = x + 5 dan g(x) = 4x, maka (g∘f)(x) = ...',
   choices:['4x + 5','4x + 20','4x − 5','x + 20'],answer:1,
   explain:'(g∘f)(x) = g(f(x)) = g(x + 5) = 4(x + 5) = 4x + 20 = <b>4x + 20</b>.'},
  {diff:'easy',q:'Dalam pembuatan roti, fungsi f(x) = 2x mewakili waktu fermentasi dan g(x) = x + 10 mewakili suhu oven. Jika (f∘g)(x) = 2(x + 10), maka (f∘g)(5) = ...',
   choices:['20','25','30','35'],answer:2,
   explain:'(f∘g)(5) = 2(5 + 10) = 2(15) = <b>30</b>.'},
  
  // SEDANG (5)
  {diff:'medium',q:'Diketahui f(x) = x² + 1 dan g(x) = 2x − 3. Nilai (f∘g)(2) adalah...',
   choices:['2','5','10','17'],answer:1,
   explain:'(f∘g)(2) = f(g(2)) = f(2(2) − 3) = f(1) = 1² + 1 = 1 + 1 = <b>2</b>. <i>Koreksi: jawaban yang benar adalah 2, bukan 5.</i>'},
  {diff:'medium',q:'Jika f(x) = 3x + 2 dan g(x) = x² − 1, maka (g∘f)(1) = ...',
   choices:['15','24','35','48'],answer:2,
   explain:'(g∘f)(1) = g(f(1)) = g(3(1) + 2) = g(5) = 5² − 1 = 25 − 1 = <b>24</b>.'},
  {diff:'medium',q:'Diketahui f(x) = 2x + 1, g(x) = x², dan h(x) = x − 3. Nilai (f∘g∘h)(2) = ...',
   choices:['3','7','15','19'],answer:2,
   explain:'(f∘g∘h)(2) = f(g(h(2))) = f(g(2 − 3)) = f(g(−1)) = f((−1)²) = f(1) = 2(1) + 1 = <b>3</b>. <i>Koreksi: jawaban yang benar adalah 3.</i>'},
  {diff:'medium',q:'Jika (f∘g)(x) = 6x + 5 dan f(x) = 2x + 1, maka g(x) = ...',
   choices:['3x + 2','3x + 3','2x + 3','2x + 2'],answer:0,
   explain:'(f∘g)(x) = f(g(x)) = 2g(x) + 1 = 6x + 5. Maka 2g(x) = 6x + 4, sehingga g(x) = <b>3x + 2</b>.'},
  {diff:'medium',q:'Dalam resep saus, fungsi f(x) = x/2 mewakili pengenceran dan g(x) = x + 4 mewakili penambahan bumbu. Jika (g∘f)(x) = x/2 + 4, maka (g∘f)(10) = ...',
   choices:['7','8','9','10'],answer:2,
   explain:'(g∘f)(10) = 10/2 + 4 = 5 + 4 = <b>9</b>.'},
  
  // SULIT (5)
  {diff:'hard',q:'Diketahui f(x) = (x − 2)/(x + 1) untuk x ≠ −1. Nilai (f∘f)(3) adalah...',
   choices:['1/4','1/2','1','2'],answer:0,
   explain:'f(3) = (3 − 2)/(3 + 1) = 1/4. Kemudian (f∘f)(3) = f(f(3)) = f(1/4) = (1/4 − 2)/(1/4 + 1) = (−7/4)/(5/4) = −7/5. <i>Koreksi: (f∘f)(3) = f(1/4) = (1/4 − 2)/(1/4 + 1) = (−7/4)/(5/4) = −7/5.</i>'},
  {diff:'hard',q:'Jika f(x) = 2x + 3 dan (f∘f)(x) = 4x + 9, maka (f∘f∘f)(1) = ...',
   choices:['15','21','33','45'],answer:2,
   explain:'f(1) = 2(1) + 3 = 5. (f∘f)(1) = f(f(1)) = f(5) = 2(5) + 3 = 13. (f∘f∘f)(1) = f((f∘f)(1)) = f(13) = 2(13) + 3 = <b>29</b>. <i>Koreksi: jawaban yang benar adalah 29.</i>'},
  {diff:'hard',q:'Diketahui f(x) = x² dan g(x) = x + 1. Domain dari (f∘g)(x) adalah...',
   choices:['Semua bilangan real','x ≥ 0','x ≥ −1','x ≠ −1'],answer:0,
   explain:'(f∘g)(x) = f(g(x)) = f(x + 1) = (x + 1)². Fungsi kuadrat terdefinisi untuk semua bilangan real, sehingga domainnya adalah <b>semua bilangan real</b>.'},
  {diff:'hard',q:'Dalam produksi kue, fungsi f(x) = 1.5x mewakili biaya bahan dan g(x) = x + 200 mewakili biaya tetap. Jika total biaya C(x) = (f∘g)(x), maka C(100) = ...',
   choices:['300','450','600','750'],answer:1,
   explain:'C(x) = (f∘g)(x) = f(g(x)) = f(x + 200) = 1.5(x + 200). C(100) = 1.5(100 + 200) = 1.5(300) = <b>450</b>.'},
  {diff:'hard',q:'Diketahui f(x) = 3x − 2 dan g(x) = (x + 2)/3. Nilai (f∘g)(x) + (g∘f)(x) adalah...',
   choices:['2x','3x','4x','5x'],answer:0,
   explain:'(f∘g)(x) = f((x+2)/3) = 3((x+2)/3) − 2 = x + 2 − 2 = x. (g∘f)(x) = g(3x−2) = ((3x−2)+2)/3 = 3x/3 = x. Jadi (f∘g)(x) + (g∘f)(x) = x + x = <b>2x</b>.'}
];

/* ================= STATE ================= */
let G = {
  mode:'individual', teams:[], currentTeam:0, currentQ:0, 
  questions:[], timer:null, timeLeft:30, answered:false,
  soundOn:true, projectorMode:false
};

/* ================= AUDIO ================= */
const SFX = {
  ctx:null, muted:false,
  ensure(){if(!this.ctx)try{this.ctx=new(window.AudioContext||window.webkitAudioContext)}catch(e){}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  tone(f,dur=.15,type='triangle',vol=.18,delay=0){
    if(!G.soundOn||this.muted)return;this.ensure();if(!this.ctx)return;
    const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+dur+.05);},
  correct(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.13,'triangle',.2,i*.09))},
  wrong(){this.tone(220,.3,'sawtooth',.14,0,110)},
  click(){this.tone(700,.08,'square',.1)},
  tick(){this.tone(1050,.05,'square',.07)},
  timeup(){this.tone(200,.45,'sawtooth',.16,0,80)},
  fanfare(){[[523,0],[659,.12],[784,.24],[1047,.36],[1319,.48]].forEach(([f,d])=>this.tone(f,.2,'triangle',.2,d))}
};

/* ================= SETUP ================= */
function selectMode(mode){
  SFX.click();
  G.mode=mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('selected'));
  event.target.classList.add('selected');
  renderTeamInputs();
}
function renderTeamInputs(){
  const list=document.getElementById('teamList');
  list.innerHTML='';
  const count=G.mode==='individual'?2:2;
  for(let i=0;i<count;i++)addTeam();
}
function addTeam(){
  const list=document.getElementById('teamList');
  const idx=list.children.length+1;
  const div=document.createElement('div');
  div.style.cssText='display:flex;gap:10px;margin-bottom:10px;align-items:center';
  div.innerHTML=`
    <span style="font-size:1.3rem">${G.mode==='individual'?'👤':'👥'}</span>
    <input class="team-input" type="text" placeholder="${G.mode==='individual'?'Nama peserta':'Nama tim'} ${idx}" maxlength="20">
    <button class="btn" style="padding:10px 16px;font-size:.9rem" onclick="this.parentElement.remove()">✕</button>`;
  list.appendChild(div);
}
function startGame(){
  SFX.click();
  G.projectorMode=document.getElementById('projMode').checked;
  G.soundOn=document.getElementById('soundOn').checked;
  if(G.projectorMode)document.body.classList.add('projector-mode');
  
  const inputs=document.querySelectorAll('.team-input');
  G.teams=[];
  inputs.forEach((inp,i)=>{
    const name=inp.value.trim()||`${G.mode==='individual'?'Peserta':'Tim'} ${i+1}`;
    G.teams.push({name,score:0,correct:0,wrong:0,powerups:{fifty:false,skip:false,time:false}});
  });
  
  if(G.teams.length<2){alert('Minimal 2 peserta/tim!');return;}
  
  // Acak soal
  G.questions=shuffle([...SOAL]);
  G.currentQ=0;G.currentTeam=0;
  
  showScreen('scr-arena');
  renderScoreboard();
  showQuestion();
}

/* ================= GAME LOGIC ================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function renderScoreboard(){
  const sb=document.getElementById('scoreboard');
  sb.innerHTML=G.teams.map((t,i)=>`
    <div class="team-card ${i===G.currentTeam?'active':''}" id="team${i}">
      <div class="team-name">${G.mode==='individual'?'👤':'👥'} ${t.name}</div>
      <div class="team-score">${t.score}</div>
      <div class="powerups">
        <button class="powerup" title="50:50" ${t.powerups.fifty?'':'disabled'} onclick="usePowerup(${i},'fifty')">½</button>
        <button class="powerup" title="Lewati" ${t.powerups.skip?'':'disabled'} onclick="usePowerup(${i},'skip')">⏭️</button>
        <button class="powerup" title="+10 detik" ${t.powerups.time?'':'disabled'} onclick="usePowerup(${i},'time')">⏱️</button>
      </div>
    </div>`).join('');
}
function showQuestion(){
  G.answered=false;
  const q=G.questions[G.currentQ];
  const diffMap={easy:'MUDAH',medium:'SEDANG',hard:'SULIT'};
  const roundNum=Math.floor(G.currentQ/5)+1;
  const roundNames=['','Mudah','Sedang','Sulit'];
  
  document.getElementById('roundName').textContent=`Babak ${roundNum}: ${roundNames[roundNum]}`;
  document.getElementById('roundDesc').textContent=`Soal ${G.currentQ+1} dari 15`;
  document.getElementById('qDifficulty').textContent=diffMap[q.diff];
  document.getElementById('qDifficulty').className='q-difficulty '+q.diff;
  document.getElementById('qNumber').textContent=`Soal ${G.currentQ+1}/15`;
  document.getElementById('qText').innerHTML=q.q;
  
  const choices=document.getElementById('qChoices');
  const items=shuffle(q.choices.map((c,i)=>({c,ok:i===q.answer})));
  G.currentItems=items;
  choices.innerHTML=items.map((it,i)=>`
    <button class="choice" onclick="pickAnswer(${i})">
      <span class="key">${String.fromCharCode(65+i)}</span>${it.c}
    </button>`).join('');
  
  document.getElementById('qExplanation').classList.remove('show');
  document.getElementById('nextBtn').classList.add('hidden');
  
  startTimer();
  renderScoreboard();
}
function startTimer(){
  clearInterval(G.timer);
  G.timeLeft=30;
  updateTimerDisplay();
  G.timer=setInterval(()=>{
    G.timeLeft-=0.1;
    if(G.timeLeft<=5&&G.timeLeft>0&&Math.floor(G.timeLeft*10)%10===0)SFX.tick();
    if(G.timeLeft<=0){clearInterval(G.timer);onTimeout();}
    updateTimerDisplay();
  },100);
}
function updateTimerDisplay(){
  const el=document.getElementById('timerNum');
  el.textContent=Math.ceil(G.timeLeft);
  el.className='timer-num'+(G.timeLeft<=5?' danger':G.timeLeft<=10?' warn':'');
}
function pickAnswer(i){
  if(G.answered)return;
  G.answered=true;
  clearInterval(G.timer);
  
  const btns=[...document.getElementById('qChoices').children];
  btns.forEach(b=>b.disabled=true);
  
  const okIdx=G.currentItems.findIndex(it=>it.ok);
  const q=G.questions[G.currentQ];
  const points=q.diff==='easy'?100:q.diff==='medium'?200:300;
  
  if(G.currentItems[i].ok){
    btns[i].classList.add('correct');
    G.teams[G.currentTeam].score+=points;
    G.teams[G.currentTeam].correct++;
    SFX.correct();
    pointPopup(btns[i],`+${points}`);
    confettiBurst(btns[i],15);
  }else{
    btns[i].classList.add('wrong');
    btns[okIdx].classList.add('correct');
    G.teams[G.currentTeam].wrong++;
    SFX.wrong();
  }
  
  showExplanation(q);
  renderScoreboard();
}
function onTimeout(){
  if(G.answered)return;
  G.answered=true;
  const btns=[...document.getElementById('qChoices').children];
  btns.forEach(b=>b.disabled=true);
  const okIdx=G.currentItems.findIndex(it=>it.ok);
  btns[okIdx].classList.add('correct');
  G.teams[G.currentTeam].wrong++;
  SFX.timeup();
  showExplanation(G.questions[G.currentQ]);
  renderScoreboard();
}
function showExplanation(q){
  document.getElementById('explanationText').innerHTML=q.explain;
  document.getElementById('qExplanation').classList.add('show');
  document.getElementById('nextBtn').classList.remove('hidden');
}
function nextQuestion(){
  SFX.click();
  G.currentQ++;
  if(G.currentQ>=15){endGame();return;}
  G.currentTeam=(G.currentTeam+1)%G.teams.length;
  showQuestion();
}
function usePowerup(teamIdx,type){
  if(G.answered||teamIdx!==G.currentTeam)return;
  SFX.click();
  const team=G.teams[teamIdx];
  if(!team.powerups[type])return;
  
  if(type==='fifty'){
    const wrongIdxs=G.currentItems.map((it,i)=>it.ok?-1:i).filter(i=>i>=0);
    shuffle(wrongIdxs).slice(0,2).forEach(i=>{
      document.getElementById('qChoices').children[i].classList.add('eliminated');
    });
  }else if(type==='skip'){
    clearInterval(G.timer);
    G.currentQ++;
    if(G.currentQ>=15){endGame();return;}
    G.currentTeam=(G.currentTeam+1)%G.teams.length;
    showQuestion();
    return;
  }else if(type==='time'){
    G.timeLeft+=10;
  }
  
  team.powerups[type]=false;
  renderScoreboard();
}
function endGame(){
  clearInterval(G.timer);
  SFX.fanfare();
  
  const sorted=[...G.teams].sort((a,b)=>b.score-a.score);
  const tbody=document.getElementById('recapBody');
  tbody.innerHTML=sorted.map((t,i)=>`
    <tr class="${i===0?'winner':''}">
      <td class="rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td>
      <td>${t.name}</td>
      <td><b style="color:var(--gold);font-size:1.3rem">${t.score}</b></td>
      <td style="color:var(--green)">${t.correct}</td>
      <td style="color:var(--red)">${t.wrong}</td>
    </tr>`).join('');
  
  showScreen('scr-recap');
  confettiRain();
}

/* ================= EFEK ================= */
function pointPopup(el,txt){
  const r=el.getBoundingClientRect();
  const d=document.createElement('div');
  d.className='point-popup';
  d.textContent=txt;
  d.style.left=(r.left+r.width/2-40)+'px';
  d.style.top=(r.top-20)+'px';
  document.getElementById('fxLayer').appendChild(d);
  setTimeout(()=>d.remove(),1600);
}
function confettiBurst(el,n){
  const r=el.getBoundingClientRect();
  const colors=['#ffd700','#ff2d55','#00d4ff','#00ff88','#a855f7'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=(r.left+r.width/2)+'px';
    c.style.top=(r.top+r.height/2)+'px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.setProperty('--sw',(Math.random()*300-150)+'px');
    c.style.animationDuration=(1+Math.random()*2)+'s';
    c.style.animationDelay=(Math.random()*.3)+'s';
    document.getElementById('fxLayer').appendChild(c);
    setTimeout(()=>c.remove(),3500);
  }
}
function confettiRain(){
  const colors=['#ffd700','#ff2d55','#00d4ff','#00ff88','#a855f7'];
  for(let i=0;i<120;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.setProperty('--sw',(Math.random()*200-100)+'px');
    c.style.animationDuration=(2+Math.random()*3)+'s';
    c.style.animationDelay=(Math.random()*2)+'s';
    document.getElementById('fxLayer').appendChild(c);
    setTimeout(()=>c.remove(),7000);
  }
}

/* ================= UTIL ================= */
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function closeOverlay(){SFX.click();document.getElementById('overlay').classList.remove('show');}

/* ================= INIT ================= */
renderTeamInputs();
document.addEventListener('keydown',e=>{
  if(!document.getElementById('scr-arena').classList.contains('active'))return;
  if(!G.answered&&['1','2','3','4'].includes(e.key))pickAnswer(parseInt(e.key)-1);
  if(G.answered&&e.key==='Enter')nextQuestion();
});
</script>
